[workspace]
authors = ["Frankie <1364239823@qq.com>"]
channels = ["conda-forge", "pytorch", "nvidia"]
name = "Anima"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
manifest = "python scripts/build_manifest.py"
annotate = "python scripts/annotate_images.py"
index = "python scripts/build_indexes.py"
train = "python scripts/train_retriever.py"
evaluate = "python scripts/evaluate_retrieval.py"
app = "python scripts/launch_app.py"
test = "pytest -q"

[dependencies]
python = ">=3.11,<3.12"
pip = ">=24"

[pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/cu128" }
accelerate = ">=1.14.0, <2"
diffusers = ">=0.39.0, <0.40"
einops = ">=0.8.0, <1"
faiss-cpu = ">=1.14.3, <2"
gradio = ">=6.22.0, <7"
jieba = ">=0.42.1, <0.43"
matplotlib = ">=3.11.1, <4"
numpy = ">=2.4.6, <3"
pandas = ">=3.0.5, <4"
pillow = ">=12.3.0, <13"
pydantic = ">=2.13.4, <3"
pytest = ">=9.1.1, <10"
pyyaml = ">=6.0.3, <7"
rank-bm25 = ">=0.2.2, <0.3"
scikit-learn = ">=1.9.0, <2"
sentence-transformers = ">=5.6.1, <6"
seaborn = ">=0.13.2, <0.14"
timm = ">=1.0.0, <2"
transformers = ">=5.14.1, <6"
xformers = "==0.0.35"
modelscope = ">=1.39.0, <2"
