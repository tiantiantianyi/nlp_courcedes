version: chinese-clip-zero-shot-v1
categories:
  indoor:
    label: 室内
    prompts:
      - 一张室内房间或建筑内部的照片
      - 室内空间、家具和房间场景
    prompt_suffix: 重点核对房间功能、家具、室内布局、人工照明和可见物品。
  street:
    label: 街景
    prompts:
      - 一张城市街道和道路环境的照片
      - 街道、商店、行人和城市建筑场景
    prompt_suffix: 重点核对道路、建筑、店铺、行人、天气、交通状况和空间关系。
  nature:
    label: 自然风光
    prompts:
      - 一张山水、森林、海岸或自然景观照片
      - 户外自然风景、天空、植被和水体
    prompt_suffix: 重点核对地貌、植被、水体、天空、天气、季节线索和整体色调。
  portrait:
    label: 人像
    prompts:
      - 一张以人物为主体的人像照片
      - 人物近景、面部、穿着和动作场景
    prompt_suffix: 重点核对人物数量、可见动作、服饰和姿态；禁止推测身份、职业或关系。
  food:
    label: 美食
    prompts:
      - 一张食物、菜品、餐桌或饮品照片
      - 美食、餐具、食材和摆盘场景
    prompt_suffix: 重点核对菜品种类、可见食材、餐具、摆盘、数量和颜色。
  night:
    label: 夜景
    prompts:
      - 一张夜晚、低光或城市灯光照片
      - 黑暗天空、霓虹灯和夜间照明场景
    prompt_suffix: 重点核对夜间光源、灯光颜色、曝光、可见建筑和不确定的暗部细节。
  text_scene:
    label: 文字招牌
    prompts:
      - 一张包含大量文字、标牌或店铺招牌的照片
      - 可见中文文字、路牌、广告牌和屏幕的场景
    prompt_suffix: 优先逐字核对 OCR、文字位置、语言和标牌类型；无法辨认的字符写入不确定字段。
  transport:
    label: 交通工具
    prompts:
      - 一张汽车、自行车、火车或其他交通工具照片
      - 道路车辆、交通设施和出行场景
    prompt_suffix: 重点核对交通工具类别、数量、颜色、相对位置、道路和行驶状态。
  animal:
    label: 动植物特写
    prompts:
      - 一张动物、宠物、鸟类或植物特写照片
      - 动植物主体、自然细节和近距离拍摄场景
    prompt_suffix: 重点核对物种可见特征、数量、姿态、周边环境；无法确认物种时避免强行分类。
